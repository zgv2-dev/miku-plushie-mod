plugins {
	id 'fabric-loom' version "${loom_version}"
}

// jar is miku-plushie-<mod_version>+<mc>.jar; per-MC deps come from versions/<mc>/gradle.properties
version = "${project.mod_version}+${sc.current.version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup("maven.modrinth")
        }
    }
}

// datagen output is per MC version: versions/<mc>/src/main/generated
fabricApi {
	configureDataGeneration {
		client = true
	}
}

loom {
	// class tweaker uses #? stonecutter conditions, processed per version
	accessWidenerPath = sc.process(rootProject.file("src/main/resources/miku-plushie.classtweaker"), "build/processed.ct")
	runConfigs.all {
		runDir = "../../run" // one run/ dir shared by all versions
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	// MC 26.x ships deobfuscated (Mojang official names); no `mappings` layer needed.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// GeckoLib (fabric) via Modrinth maven; geckolib_version is the Modrinth version id
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
}

processResources {
	def props = [version: project.version, minecraft: project.minecraft_version, geckolib: project.geckolib_min]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
