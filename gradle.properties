# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# MC 26.x ships unobfuscated; no mappings/remapping needed.
fabric.loom.disableObfuscation=true

# Fabric Properties
# check these on https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
mod_version=2.2.0
maven_group=com.any.mikuplushie
archives_base_name=miku-plushie

# Per-Minecraft-version deps (fabric_version, geckolib_version) live in versions/<mc>/gradle.properties

# Groovy buildscripts are intentional; silences Stonecutter's Kotlin nag
dev.kikugie.stonecutter.hard_mode=true
