# Build every MC version (Stonecutter: versions/<mc>) on push/PR to 26.x-fabric;
# on a "v*" tag also publish all jars as one GitHub Release.
name: build
on:
  push:
    branches: ['26.x-fabric']
    tags: ['v*']
  pull_request:
    branches: ['26.x-fabric']
  workflow_dispatch: # run on a tag to (re)publish its Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x ./gradlew && ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: versions/*/build/libs/
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: versions/*/build/libs/*[!s].jar
